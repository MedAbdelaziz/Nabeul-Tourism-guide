<html lang="en">
<head>
    
    <title>Nabeul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel = "stylesheet" href="styles/home.css">
    <link rel = "stylesheet" href="styles/image.css">

    <link rel="stylesheet" href="styles/reservation.css">   
    <link rel="stylesheet" href="styles/global.css">

</head>
<body class="home">
    <header>
        <div style="height:80px;" class="navbar ">
            <div class="logo-container">
                <img src="images/icons-and-logos/logo2.png" class="logo">
            </div>
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="places-to-visit.html">Visit</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="accommodation.html">Accommodation & Restaurants</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="reservation.html">Reservation</a>
                </li>
            </ul>
        </div>
        
        
        <div class="banner">
            <video autoplay muted loop id="video-background">
                <source src="images/home page/f3a7349b-e46f-4a3f-8710-4349fd975861.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <h1>Welcome to Nabeul</h1>
                <p>Your gateway to the beautiful coastal city of Nabeul, Tunisia.</p>
            </div>
            
        </div>
        
        
        
    </header>


    <section id="places-to-visit">
    <div class="section-container">
        <div class="title-section">
            <h2 class="places-to-visit-title">Places to visit</h2>
        </div>
        
        <div class="places-container">
            <div class ="image-container">
                <img src="images/souk.jpg" class="places-to-visit">  
                <p>Medina of Nabeul</p>
            </div>
            <div class="image-container">
                <img src="images/sunrise.jpg" class="places-to-visit">
                <p>Nabeul Beach</p>
            </div>
            <div class="image-container">
                <img src="images/dar-sebastien1.jpg" class="places-to-visit">    
                <p>Dar Sebastien</p>
            </div>
            <!--<div>El Haouaria Cliffs</div>
            <div>Nabeul Archaeological Museum</div>
            <div></div>-->
                      


        </div>
    </div>        
    </section>


    <section id="accomodation">
        <div class="section-container">
            <div class="title-section">
                <h2 id="accommodation-title">Accomodation</h2>
            </div>
            
            <div class="accommodation-container">
                <div class ="image-container">
                    <img src="images/hotels/oceana-main.jpg" class="accommodation">  
                    <p>Oceana Hotel</p>
                </div>
                <div class="image-container">
                    <img src="images/hotels/lux-apartment.jpg" class="accommodation">
                    <p>Nabeul Luxury apartments </p>
                </div>
                <div class="image-container">
                    <img src="images/hotels/mirage-main.jpg" class="accommodation">    
                    <p>Mirage Hotel</p>

                </div>
                        


            </div>
        </div>
    </section>
    <section id="reservation">
        <div class="section-container">
            <div class="title-section">
                <h2>Reservation</h2>
            </div>
            <div class="reservation-container">
                <form id="reserve" class="reservation-form">
                    <i class="fi fi-tr-calendar-clock"></i>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required><br><br>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br><br>
                    
                    <label for="date">Date of Visit:</label>
                    <input type="date" id="date" name="date" required><br><br>
                    
                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" required><br><br>
                    
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
        
    </section>
    <footer>

    </footer>
</body>
