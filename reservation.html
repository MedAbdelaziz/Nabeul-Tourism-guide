<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation - Nabeul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/reservation.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/image.css">
</head>
<body>
  <header>
    <div style="height:80px;" class="navbar">
      <div class="logo-container">
        <img src="images/icons-and-logos/logo2.png" class="logo">
      </div>
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="places-to-visit.html">Visit</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="accommodation.html">Accommodation & Restaurants</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="reservation.html">Reservation</a>
        </li>
      </ul>
    </div>

    <div class="header-reservation">
      Make a Reservation
    </div>
  </header>

  <main class="container my-5">
    <form class="reservation-form">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Your Name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="+216 ..." required>
      </div>

      <div class="mb-3">
        <label for="place" class="form-label">Place/Hotel</label>
        <select id="place" class="form-select" required>
          <option value="" disabled selected>Select a place</option>
          <option value="souks">Nabeul Souk</option>
          <option value="dar">Dar Sebastien</option>
          <option value="castle">The Castle</option>
          <option value="mosque">The Mosque</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="date" class="form-label">Reservation Date</label>
        <input type="date" id="date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="guests" class="form-label">Number of Guests</label>
        <input type="number" id="guests" class="form-control" min="1" max="20" value="1" required>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">Book Now</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
